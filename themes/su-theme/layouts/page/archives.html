{{ define "shell" }} page-shell--list{{ end }}
{{ define "main" }}
{{ $posts := where site.RegularPages "Type" "in" site.Params.mainSections }}
<section class="archives">
  <ul class="post-rows post-rows--archive">
    {{ range $posts }}
      {{ partial "post_row.html" (dict "page" . "showSub" true) }}
    {{ end }}
  </ul>
</section>
{{ end }}
