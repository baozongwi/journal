baseURL = "https://baozongwi.xyz/journal/"
DefaultContentLanguage = "en"
title = "Journal"
theme = "su-theme"
timeZone = "Asia/Shanghai"
timeout = "60m"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 6
    ordered = false
    startLevel = 1
  [markup.highlight]
    lineNos = false
    codeFences = true
    guessSyntax = false
    style = "github"
    noClasses = false

[Params]
  mainSections = ["post"]
  katex = false
  homeTitle = "Journal"
  dateFormat = "January 2, 2006"
  commit = false
  rss = false
  showRelatedPosts = false
  selfHosted = true
  readingTime = true
  wordCount = true
  useHLJS = false
  socialShare = false
  since = 2025

[Params.author]
  name = "baozongwi"
  github = "baozongwi"

disableKinds = ["RSS"]

[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 10

[permalinks]
  post = "/:slug/"

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[imaging]
  quality = 80
  resampleFilter = "CatmullRom"
  hint = "picture"
  anchor = "Center"
  [imaging.exif]
    disableLatLong = true

[[module.mounts]]
  source = "content"
  target = "content"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "**"]

[[module.mounts]]
  source = "content"
  target = "assets/c"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "static"
  files = ["! **.png", "! **.jpg", "! **.jpeg", "! **.webp", "! **.gif", "! **.ico", "**"]

[[module.mounts]]
  source = "static"
  target = "assets/s"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[menu.main]]
  name = "Archives"
  url = "archives/"
  weight = 1
[[menu.main]]
  name = "Tags"
  url = "tags/"
  weight = 2
