{{ define "shell" }} page-shell--list{{ end }}
{{ define "main" }}
<section class="archives">
  <header class="page-list__header">
    <h1 class="page-list__title">{{ .Title }}</h1>
  </header>
  <ul class="post-rows post-rows--archive">
    {{ range .Paginator.Pages }}
      {{ partial "post_row.html" (dict "page" . "showSub" true) }}
    {{ end }}
  </ul>
  {{ if or (.Paginator.HasPrev) (.Paginator.HasNext) }}
    {{ partial "pagination.html" . }}
  {{ end }}
</section>
{{ end }}
