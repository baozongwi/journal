name: Deploy Hugo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: .cache/ZhuqueFangsong-Regular.ttf
          key: zhuque-fangsong-v0.212

      - name: Build Zhuque subset
        env:
          ZHUQUE_TTF: .cache/ZhuqueFangsong-Regular.ttf
        run: |
          python -m pip install --disable-pip-version-check fonttools brotli
          python scripts/subset-zhuque.py

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.1"
          extended: true

      - uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-images-${{ hashFiles('hugo.toml', 'layouts/partials/process-image.html', 'layouts/partials/process-image-inner.html', 'layouts/_markup/render-image.html') }}
          restore-keys: |
            hugo-images-

      - uses: actions/configure-pages@v6

      - name: Build
        run: hugo --minify --baseURL "https://baozongwi.xyz/journal/" --buildFuture --cleanDestinationDir --gc
        env:
          HUGO_PROCESS_WEBP: "1"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
